# Omarchy Server tmux configuration
# Persistent bottom status bar with Nerd Font powerline pills, live server
# telemetry, disconnect resilience, and floating popups for om & om fleet.

# Prefix: Ctrl+Space (primary, matching Omarchy Desktop) + Ctrl+B (standard)
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Terminal & ergonomics
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# Bottom status bar (Tokyo Night surface + amber host anchor)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#13141c,fg=#a9b1d6"
set -g status-left-length 48
set -g status-right-length 140
set -g status-justify left

# Host pill on the far left (amber powerline cap)
set -g status-left " #[fg=#e0af68,bg=#13141c]#[bg=#e0af68,fg=#15161e,bold]󰒋 #h#[fg=#e0af68,bg=#13141c,nobold]  "

# Window pills (active in slate, inactive muted)
set -g window-status-separator " "
set -g window-status-current-style "none"
set -g window-status-style "none"
set -g window-status-current-format "#[fg=#24283b,bg=#13141c]#[bg=#24283b,fg=#c0caf5,bold]#I #W#[fg=#24283b,bg=#13141c,nobold]"
set -g window-status-format "#[fg=#565f89,bg=#13141c] #I #W "

# Right side: live server telemetry + alerts + om pill
set -g status-right "#(omarchy-server-bar)"

# Pane & popup borders
set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#e0af68"
set -g popup-border-style "fg=#3b3526"
set -g popup-style "bg=#16161e,fg=#c0caf5"

# Floating Omarchy popups: prefix + m (om menu), prefix + f (om fleet)
bind m display-popup -E -w 84% -h 76% -b rounded -S "fg=#3b3526" "OMARCHY_IN_POPUP=1 omarchy-server-menu"
bind f display-popup -E -w 84% -h 76% -b rounded -S "fg=#3b3526" "OMARCHY_IN_POPUP=1 omarchy-fleet"
