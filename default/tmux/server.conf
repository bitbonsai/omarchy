# Omarchy Server tmux configuration
# Persistent bottom status bar with Nerd Font powerline pills, live server
# telemetry, disconnect resilience, clickable pills, keyboard bar navigation,
# and floating popups for om, fleet, and shortcuts.

# Prefix: Ctrl+Space (primary, matching Omarchy Desktop) + Ctrl+B (standard)
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Terminal & ergonomics
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},tmux},bash,#{pane_current_command}}'

# Bottom status bar (Tokyo Night surface + amber host anchor)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#13141c,fg=#a9b1d6"
set -g status-left-length 100
set -g status-right-length 160
set -g status-justify left

# Left side: quiet gray PREFIX hint strip when prefix is active; clickable host pill otherwise
set -g status-left "#{?client_prefix, #[fg=#24283b#,bg=#13141c]#[bg=#24283b#,fg=#a9b1d6#,bold]PREFIX#[fg=#24283b#,bg=#13141c#,nobold]  #[fg=#e0af68#,bold]o#[fg=#a9b1d6#,nobold] om  #[fg=#e0af68#,bold]f#[fg=#a9b1d6#,nobold] fleet  #[fg=#e0af68#,bold]c#[fg=#a9b1d6#,nobold] tab  #[fg=#e0af68#,bold]Tab#[fg=#a9b1d6#,nobold] bar  #[fg=#e0af68#,bold]?#[fg=#a9b1d6#,nobold] keys  , #[range=user|host]#{?#{==:#{@om_bar_focus},host},#[fg=#c0caf5#,bg=#13141c]#[bg=#c0caf5#,fg=#15161e#,bold]󰒋 #h#[fg=#c0caf5#,bg=#13141c#,nobold],#[fg=#e0af68#,bg=#13141c]#[bg=#e0af68#,fg=#15161e#,bold]󰒋 #h#[fg=#e0af68#,bg=#13141c#,nobold]}#[norange]  }"

# Window pills (active in slate, inactive muted)
set -g window-status-separator " "
set -g window-status-current-style "none"
set -g window-status-style "none"
set -g window-status-current-format "#[fg=#24283b,bg=#13141c]#[bg=#24283b,fg=#c0caf5,bold]#I #W#[fg=#24283b,bg=#13141c,nobold]"
set -g window-status-format "#[fg=#565f89,bg=#13141c] #I #W "

# Right side: cancel hint during prefix; live clickable pills otherwise
set -g status-right "#{?client_prefix, #[fg=#565f89]esc cancel ,#(omarchy-server-bar)}"

# Pane & popup borders
set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#e0af68"
set -g popup-border-style "fg=#3b3526"
set -g popup-style "bg=#16161e,fg=#c0caf5"

# Floating Omarchy popups: prefix + o/m (om menu), prefix + f (fleet), prefix + ? (shortcuts)
bind m run-shell "omarchy-server-bar --open om"
bind o run-shell "omarchy-server-bar --open om"
bind f run-shell "omarchy-server-bar --open fleet"
bind ? run-shell "omarchy-server-bar --open help"

# Direct no-prefix shortcuts (Linux and Meta-enabled macOS terminals)
bind -n M-o run-shell "omarchy-server-bar --open om"
bind -n M-f run-shell "omarchy-server-bar --open fleet"
bind -n M-? run-shell "omarchy-server-bar --open help"

# Clickable status bar pills (dispatched via #[range=user|<id>])
bind -n MouseDown1StatusLeft if-shell -F '#{m:user|*,#{mouse_status_range}}' \
  'run-shell "omarchy-server-bar --open #{s|^user\\|||:#{mouse_status_range}}"' ''
bind -n MouseDown1StatusRight if-shell -F '#{m:user|*,#{mouse_status_range}}' \
  'run-shell "omarchy-server-bar --open #{s|^user\\|||:#{mouse_status_range}}"' ''

# Keyboard bar focus: Prefix + Tab highlights pills in place; ←/→ moves, Enter opens, Esc cancels
bind Tab run-shell "omarchy-server-bar --focus start"
bind -T bar-focus Right  run-shell "omarchy-server-bar --focus next"
bind -T bar-focus l      run-shell "omarchy-server-bar --focus next"
bind -T bar-focus Tab    run-shell "omarchy-server-bar --focus next"
bind -T bar-focus Left   run-shell "omarchy-server-bar --focus prev"
bind -T bar-focus h      run-shell "omarchy-server-bar --focus prev"
bind -T bar-focus Enter  run-shell "omarchy-server-bar --focus open"
bind -T bar-focus Escape run-shell "omarchy-server-bar --focus cancel"
bind -T bar-focus Up     run-shell "omarchy-server-bar --focus cancel"
bind -T bar-focus q      run-shell "omarchy-server-bar --focus cancel"
